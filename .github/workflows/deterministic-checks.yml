name: Deterministic Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        # Pinned to a full commit SHA so a moved tag cannot silently change
        # the executed action. Dependabot keeps the digest current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deterministic checks
        run: ./.beryl/scripts/check.sh

      - name: Run agent doctor
        run: ./.beryl/agent/scripts/agent-doctor.sh

      - name: Run cross-platform install and setup smoke test
        run: ./.beryl/scripts/portability-smoke.sh
